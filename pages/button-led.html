<!DOCTYPE html>
<html>
<head>
<title>Button LED</title>
<style>
body{background:#0d1117;color:white;font-family:Arial;padding:20px;}
pre{background:#161b22;padding:15px;border-radius:8px;}
</style>
</head>

<body>

<h1>Button Control LED</h1>

<p>Press button → LED ON</p>

<pre id="code">
int button = 2;

void setup(){
  pinMode(13, OUTPUT);
  pinMode(button, INPUT);
}

void loop(){
  if(digitalRead(button)==HIGH){
    digitalWrite(13, HIGH);
  } else {
    digitalWrite(13, LOW);
  }
}
</pre>

<button onclick="copy()">Copy</button>
<br><br>
<a href="../arduino.html">Back</a>

<script>
function copy(){
navigator.clipboard.writeText(document.getElementById("code").innerText);
}
</script>

</body>
</html>
