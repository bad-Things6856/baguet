<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LED ON - Arduino</title>

<link rel="stylesheet" href="../styles/style.css">
</head>

<body>

<div class="header">⚡ Arduino Project</div>

<div class="container">

<h1 class="title">LED ON (Built-in)</h1>

<img src="../images/led-on.png" style="width:100%; border-radius:10px;">

<p class="desc">
This program turns ON the built-in LED on Arduino (Pin 13).
</p>

<h3>📌 How it works</h3>
<p class="desc">
- Set pin 13 as OUTPUT <br>
- Send HIGH signal → LED turns ON
</p>

<h3>💻 Code</h3>

<pre id="code">
void setup() {
  pinMode(13, OUTPUT);
}

void loop() {
  digitalWrite(13, HIGH);
}
</pre>

<button onclick="copyCode()">📋 Copy Code</button>

<br><br>
<a href="../arduino.html">⬅ Back to Feed</a>

</div>

<script>
function copyCode() {
  const text = document.getElementById("code").innerText;
  navigator.clipboard.writeText(text);
  alert("Code copied!");
}
</script>

</body>
</html>
