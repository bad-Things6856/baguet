<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blink - Arduino</title>

<style>
body { margin:0; font-family:Arial; background:#0d1117; color:white; }
.header { text-align:center; padding:15px; background:#161b22; font-weight:bold; }
.container { max-width:700px; margin:auto; padding:20px; }
img { width:100%; border-radius:10px; border:1px solid #30363d; }
pre { background:#161b22; padding:15px; border-radius:8px; border:1px solid #30363d; }
button { background:#21262d; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer; }
a { color:#58a6ff; text-decoration:none; display:inline-block; margin-top:20px; }
</style>
</head>

<body>

<div class="header">⚡ Arduino Project</div>

<div class="container">
<h1>Blink LED</h1>

<img src="../images/blink.gif">

<p>Classic LED blinking program using delay.</p>

<pre id="code">
void setup() {
  pinMode(13, OUTPUT);
}

void loop() {
  digitalWrite(13, HIGH);
  delay(1000);
  digitalWrite(13, LOW);
  delay(1000);
}
</pre>

<button onclick="copy()">📋 Copy</button>

<br>
<a href="../arduino.html">⬅ Back</a>
</div>

<script>
function copy(){
  navigator.clipboard.writeText(document.getElementById("code").innerText);
  alert("Copied!");
}
</script>

</body>
