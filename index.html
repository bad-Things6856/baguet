<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embedded Lab</title>

<style>
body {
  margin: 0;
  background: #0d1117;
  color: #e6edf3;
  font-family: Arial, sans-serif;
}

/* NAVBAR */
.nav {
  background: #161b22;
  padding: 15px 30px;
  font-size: 18px;
  border-bottom: 1px solid #30363d;
}

/* HEADER */
.header {
  text-align: center;
  padding: 40px 20px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header p {
  color: #8b949e;
}

/* GRID */
.grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 25px;
  padding: 20px;
}

/* CARD */
.card {
  background: #161b22;
  width: 300px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #30363d;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
  border-color: #58a6ff;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

/* CONTENT */
.content {
  padding: 15px;
}

.title {
  font-size: 18px;
  margin-bottom: 10px;
  color: #58a6ff;
}

.spec {
  font-size: 13px;
  color: #8b949e;
  margin-bottom: 5px;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 12px;
  background: #238636;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-size: 13px;
}

.btn:hover {
  background: #2ea043;
}
</style>

</head>

<body>

<div class="nav">⚡ Embedded Systems Lab</div>

<div class="header">
  <h1>Projects & Experiments</h1>
  <p>Arduino • STM32 • Custom Builds</p>
</div>

<div class="grid">

  <!-- Arduino -->
  <div class="card">
    <img src="Images/Arduino.gif">
    <div class="content">
      <div class="title">Arduino UNO</div>
      <div class="spec">ATmega328P • 16MHz</div>
      <div class="spec">32KB Flash • 2KB SRAM</div>
      <div class="spec">Beginner → Rapid prototyping</div>
      <a class="btn" href="#">View Projects</a>
    </div>
  </div>

  <!-- STM32 -->
  <div class="card">
    <img src="Images/Stm32.gif">
    <div class="content">
      <div class="title">STM32F401 (Black Pill)</div>
      <div class="spec">Cortex-M4 • 84MHz</div>
      <div class="spec">256KB Flash • 64KB RAM</div>
      <div class="spec">Advanced control systems</div>
      <a class="btn" href="#">View Projects</a>
    </div>
  </div>

</div>

</body>
</html>
