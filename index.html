<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dev Projects</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: #e6edf3;
}

/* HEADER */
header {
  text-align: center;
  padding: 20px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  font-size: 20px;
}

/* CONTAINER */
.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 30px;
}

/* CARD */
.card {
  width: 260px;
  background: #161b22;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #30363d;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  border-color: #58a6ff;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

/* TEXT */
.card h2 {
  margin: 10px;
  font-size: 18px;
}

.card p {
  margin: 10px;
  font-size: 13px;
  color: #8b949e;
}
</style>

</head>

<body>

<header>
  🚀 My Embedded Dev Feed
</header>

<div class="container">

  <!-- ARDUINO CARD -->
  <a href="./arduino.html" class="card">
    <img src="./Images/Arduino.gif" alt="Arduino">
    <h2>Arduino UNO</h2>
    <p>Basic projects, LED control, sensors</p>
  </a>

  <!-- STM32 CARD -->
  <a href="./stm32.html" class="card">
    <img src="./Images/Stm32.gif" alt="STM32">
    <h2>STM32</h2>
    <p>Advanced control, HAL, fast processing</p>
  </a>

</div>

</body>
</html>
