<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dev Feed</title>

<style>

/* BASE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: #e6edf3;
}

/* HEADER */
.header {
  text-align: center;
  padding: 25px;
  font-size: 22px;
  font-weight: bold;
  background: #161b22;
  border-bottom: 1px solid #30363d;
}

/* GRID */
.container {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
  padding: 40px;
}

/* CARD */
.card {
  width: 280px;
  background: #161b22;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #30363d;
  text-decoration: none;
  color: white;
  transition: 0.3s;
  position: relative;
}

/* HOVER EFFECT */
.card:hover {
  transform: scale(1.05);
  border-color: #58a6ff;
  box-shadow: 0 0 20px rgba(88,166,255,0.3);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

/* OVERLAY TEXT */
.card .info {
  padding: 15px;
}

.card h2 {
  margin: 0;
  font-size: 18px;
}

.card p {
  font-size: 13px;
  color: #8b949e;
  margin-top: 5px;
}

/* TAG BADGE */
.badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #58a6ff;
  color: black;
  padding: 4px 8px;
  font-size: 10px;
  border-radius: 6px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="header">
🚀 My Embedded Projects
</div>

<div class="container">

  <!-- ARDUINO -->
  <a href="./arduino.html" class="card">
    <div class="badge">BEGINNER</div>
    <img src="./images/arduino.gif" alt="Arduino">
    <div class="info">
      <h2>Arduino UNO</h2>
      <p>LED, sensors, basic control systems</p>
    </div>
  </a>

  <!-- STM32 -->
  <a href="./stm32.html" class="card">
    <div class="badge">ADVANCED</div>
    <img src="./images/stm32.gif" alt="STM32">
    <div class="info">
      <h2>STM32</h2>
      <p>High speed, HAL, DMA, pro embedded</p>
    </div>
  </a>

</div>

</body>
</html>
