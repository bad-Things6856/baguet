<!DOCTYPE html>
<html>
<head>
    <title>Baguet</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #0d1117;
        color: white;
    }

    /* HEADER */
    .header {
        position: sticky;
        top: 0;
        background: #161b22;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #30363d;
    }

    .logo {
        font-weight: 600;
        font-size: 18px;
    }

    .search {
        padding: 6px;
        border-radius: 8px;
        border: none;
        background: #0d1117;
        color: white;
    }

    /* FEED */
    .feed {
        max-width: 500px;
        margin: auto;
    }

    .card {
        background: #161b22;
        margin: 15px;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        transition: 0.3s;
    }

    .card:hover {
        transform: scale(1.01);
    }

    .card img {
        width: 100%;
        display: block;
    }

    .content {
        padding: 10px;
    }

    .title {
        font-weight: 600;
    }

    .desc {
        font-size: 13px;
        color: #aaa;
    }

    .actions {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
    }

    .btn {
        background: #238636;
        border: none;
        padding: 6px 10px;
        border-radius: 8px;
        color: white;
        cursor: pointer;
    }

    .like {
        cursor: pointer;
    }

    </style>
</head>

<body>

<div class="header">
    <div class="logo">⚡ Baguet</div>
    <input class="search" placeholder="Search...">
</div>

<div class="feed">

    <!-- POST -->
    <div class="card" onclick="openPage('led-on.html')">
        <img src="images/led-on.png">
        <div class="content">
            <div class="title">LED ON</div>
            <div class="desc">Turn ON built-in LED</div>

            <div class="actions">
                <span class="like" onclick="like(event,this)">❤️ 0</span>
                <button class="btn">Open</button>
            </div>
        </div>
    </div>

    <!-- POST -->
    <div class="card">
        <img src="images/blink.png">
        <div class="content">
            <div class="title">Blink</div>
            <div class="desc">Basic LED blinking</div>

            <div class="actions">
                <span class="like" onclick="like(event,this)">❤️ 0</span>
                <button class="btn">Open</button>
            </div>
        </div>
    </div>

    <!-- ESP32 -->
    <div class="card" onclick="openPage('esp32.html')">
        <img src="images/esp32s3.png">
        <div class="content">
            <div class="title">ESP32</div>
            <div class="desc">XIAO ESP32-S3</div>

            <div class="actions">
                <span class="like" onclick="like(event,this)">❤️ 0</span>
                <button class="btn">Open</button>
            </div>
        </div>
    </div>

</div>

<script>

function openPage(page){
    window.location.href = page;
}

function like(e, el){
    e.stopPropagation();
    let count = parseInt(el.innerText.split(" ")[1]);
    count++;
    el.innerText = "❤️ " + count;
}

</script>

</body>
</html>
