<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Hub</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #fff;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #111;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
    }

    .logo {
      font-weight: 600;
      font-size: 20px;
      color: #00ffcc;
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;
      margin-left: 20px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #00ffcc;
    }

    /* Feed */
    .feed {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    /* Card */
    .card {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
      cursor: pointer;
      border: 1px solid #222;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(0,255,200,0.2);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 14px;
      color: #aaa;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">⚡ ProjectHub</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Projects</a>
      <a href="#">About</a>
    </div>
  </div>

  <!-- Feed -->
  <div class="feed">

    <!-- Card 1 -->
    <div class="card" onclick="openProject('project1.html')">
      <img src="assets/esp32.gif" alt="ESP32 Project">
      <div class="card-content">
        <div class="card-title">ESP32 Web Control</div>
        <div class="card-desc">Control devices via web interface using ESP32.</div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="card" onclick="openProject('project2.html')">
      <img src="assets/arduino.gif" alt="Arduino Project">
      <div class="card-content">
        <div class="card-title">Arduino Smart Sensor</div>
        <div class="card-desc">Sensor-based automation with Arduino.</div>
      </div>
    </div>

    <!-- Add more cards easily -->

  </div>

  <footer>
    © 2026 ProjectHub — Built by You 🚀
  </footer>

  <script>
    function openProject(page) {
      window.location.href = page;
    }
  </script>

</body>
</html>
