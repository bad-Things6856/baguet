<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectHub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #0f0f0f;
  color: white;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  padding: 15px 25px;
  background: #111;
  border-bottom: 1px solid #222;
}

.logo {
  color: #00ffcc;
  font-weight: 600;
}

/* Profiles (like stories) */
.profiles {
  display: flex;
  gap: 15px;
  padding: 15px;
  overflow-x: auto;
  border-bottom: 1px solid #222;
}

.profile {
  text-align: center;
  cursor: pointer;
}

.profile img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid #00ffcc;
  object-fit: cover;
}

.profile span {
  display: block;
  font-size: 12px;
  margin-top: 5px;
}

/* Feed */
.feed {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* Card */
.card {
  background: #181818;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #222;
  transition: 0.25s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 15px rgba(0,255,200,0.2);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #222;
}

.card-content {
  padding: 12px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
}

.card-desc {
  font-size: 13px;
  color: #aaa;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">⚡ ProjectHub</div>
</div>

<!-- Profiles -->
<div class="profiles">
  <div class="profile" onclick="filterProjects('esp32')">
    <img src="./assets/esp32.gif" onerror="this.src='https://via.placeholder.com/60'">
    <span>ESP32</span>
  </div>

  <div class="profile" onclick="filterProjects('stm32')">
    <img src="./assets/stm32.gif" onerror="this.src='https://via.placeholder.com/60'">
    <span>STM32</span>
  </div>

  <div class="profile" onclick="filterProjects('arduino')">
    <img src="./assets/arduino.gif" onerror="this.src='https://via.placeholder.com/60'">
    <span>Arduino</span>
  </div>
</div>

<!-- Feed -->
<div class="feed" id="feed">

  <!-- ESP32 -->
  <div class="card" data-type="esp32" onclick="openProject('project1.html')">
    <img src="./assets/esp32.gif" onerror="this.src='https://via.placeholder.com/300x180'">
    <div class="card-content">
      <div class="card-title">ESP32 Web Control</div>
      <div class="card-desc">Control devices via web</div>
    </div>
  </div>

  <!-- STM32 -->
  <div class="card" data-type="stm32" onclick="openProject('project2.html')">
    <img src="./assets/stm32.gif" onerror="this.src='https://via.placeholder.com/300x180'">
    <div class="card-content">
      <div class="card-title">STM32 RC System</div>
      <div class="card-desc">Custom RF communication system</div>
    </div>
  </div>

  <!-- Arduino -->
  <div class="card" data-type="arduino" onclick="openProject('project3.html')">
    <img src="./assets/arduino.gif" onerror="this.src='https://via.placeholder.com/300x180'">
    <div class="card-content">
      <div class="card-title">Arduino Sensor</div>
      <div class="card-desc">Automation using sensors</div>
    </div>
  </div>

</div>

<script>
function openProject(page) {
  window.location.href = page;
}

function filterProjects(type) {
  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    if (card.dataset.type === type) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>

</body>
</html>
