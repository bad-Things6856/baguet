<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Feed</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: white;
}

/* HEADER */
.header {
  text-align: center;
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
  background: #161b22;
  border-bottom: 1px solid #30363d;
}

/* FEED */
.feed {
  max-width: 500px;
  margin: auto;
  padding: 10px;
}

/* POST */
.post {
  background: #161b22;
  margin-bottom: 20px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #30363d;
  cursor: pointer;
  transition: 0.2s;
}

.post:hover {
  transform: scale(1.02);
}

/* IMAGE */
.post img {
  width: 100%;
  display: block;
}

/* CONTENT */
.content {
  padding: 12px;
}

.title {
  color: #58a6ff;
  font-weight: bold;
}

.desc {
  color: #c9d1d9;
  font-size: 14px;
}

/* ACTIONS */
.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

button {
  background: #21262d;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #30363d;
}
</style>
</head>

<body>

<div class="header">⚡ Arduino Projects Feed</div>

<div class="feed">

<!-- LED ON -->
<div class="post" onclick="openPage('pages/led-on.html')">
<img src="images/led-on.png">
<div class="content">
<div class="title">LED ON</div>
<div class="desc">Turn ON built-in LED</div>

<div class="actions">
<button onclick="like(event,'p1')">❤️ <span id="p1">0</span></button>
</div>
</div>
</div>

<!-- BLINK -->
<div class="post" onclick="openPage('pages/blink.html')">
<img src="images/blink.gif">
<div class="content">
<div class="title">Blink</div>
<div class="desc">Basic LED blinking</div>

<div class="actions">
<button onclick="like(event,'p2')">❤️ <span id="p2">0</span></button>
</div>
</div>
</div>

<!-- CUSTOM BLINK -->
<div class="post" onclick="openPage('pages/custom-blink.html')">
<img src="images/blink.gif">
<div class="content">
<div class="title">Custom Blink</div>
<div class="desc">Control speed of blinking</div>

<div class="actions">
<button onclick="like(event,'p3')">❤️ <span id="p3">0</span></button>
</div>
</div>
</div>

<!-- BUTTON LED -->
<div class="post" onclick="openPage('pages/button-led.html')">
<img src="images/button.gif">
<div class="content">
<div class="title">Button LED</div>
<div class="desc">Control LED with button</div>

<div class="actions">
<button onclick="like(event,'p4')">❤️ <span id="p4">0</span></button>
</div>
</div>
</div>

<!-- FADE LED -->
<div class="post" onclick="openPage('pages/fade-led.html')">
<img src="images/fade.gif">
<div class="content">
<div class="title">Fade LED</div>
<div class="desc">PWM brightness control</div>

<div class="actions">
<button onclick="like(event,'p5')">❤️ <span id="p5">0</span></button>
</div>
</div>
</div>

</div>

<script>

/* OPEN PAGE */
function openPage(page){
  window.location.href = page;
}

/* LIKE SYSTEM */
function like(e,id){
  e.stopPropagation();

  let count = localStorage.getItem(id) || 0;
  count++;

  localStorage.setItem(id,count);
  document.getElementById(id).innerText = count;
}

/* LOAD SAVED LIKES */
window.onload = function(){
  ['p1','p2','p3','p4','p5'].forEach(id=>{
    let val = localStorage.getItem(id) || 0;
    document.getElementById(id).innerText = val;
  });
}

</script>

</body>
</html>
