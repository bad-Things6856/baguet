<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Feed</title>

<link rel="stylesheet" href="styles/style.css">

<style>

/* NAVBAR */
.navbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 20px;
  background:#161b22;
  border-bottom:1px solid #30363d;
}

.logo {
  font-size:20px;
  font-weight:bold;
  color:#58a6ff;
}

.search {
  padding:6px;
  border-radius:6px;
  border:none;
  background:#0d1117;
  color:white;
}

/* FILTERS */
.filters {
  display:flex;
  gap:10px;
  padding:10px;
  justify-content:center;
}

.filter-btn {
  background:#21262d;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

.filter-btn:hover {
  background:#30363d;
}

/* FOOTER */
.footer {
  text-align:center;
  padding:20px;
  color:#888;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">⚡ Arduino Hub</div>
  <input class="search" placeholder="Search projects..." onkeyup="searchPost(this.value)">
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="filter-btn" onclick="filter('all')">All</button>
  <button class="filter-btn" onclick="filter('basic')">Basic</button>
  <button class="filter-btn" onclick="filter('input')">Input</button>
  <button class="filter-btn" onclick="filter('pwm')">PWM</button>
</div>

<!-- FEED -->
<div class="feed" id="feed">

<!-- LED ON -->
<div class="post basic" data-name="led on" onclick="openPage('pages/led-on.html')">
<img src="images/led-on.png">
<div class="content">
<div class="title">LED ON</div>
<div class="desc">Turn ON built-in LED</div>

<div class="actions">
<button onclick="like(event,'p1')">❤️ <span id="p1">0</span></button>
</div>
</div>
</div>

<!-- BLINK -->
<div class="post basic" data-name="blink" onclick="openPage('pages/blink.html')">
<img src="images/blink.gif">
<div class="content">
<div class="title">Blink</div>
<div class="desc">Basic LED blinking</div>

<div class="actions">
<button onclick="like(event,'p2')">❤️ <span id="p2">0</span></button>
</div>
</div>
</div>

<!-- BUTTON -->
<div class="post input" data-name="button led" onclick="openPage('pages/button-led.html')">
<img src="images/button.gif">
<div class="content">
<div class="title">Button LED</div>
<div class="desc">Control LED using button</div>

<div class="actions">
<button onclick="like(event,'p3')">❤️ <span id="p3">0</span></button>
</div>
</div>
</div>

<!-- FADE -->
<div class="post pwm" data-name="fade led" onclick="openPage('pages/fade-led.html')">
<img src="images/fade.gif">
<div class="content">
<div class="title">Fade LED</div>
<div class="desc">Smooth PWM brightness</div>

<div class="actions">
<button onclick="like(event,'p4')">❤️ <span id="p4">0</span></button>
</div>
</div>
</div>

</div>

<!-- FOOTER -->
<div class="footer">
  🚀 Built by you | Arduino + STM32 Projects
</div>

<script>

// OPEN PAGE
function openPage(page){
  window.location.href = page;
}

// LIKE SYSTEM
function like(e,id){
  e.stopPropagation();

  let count = localStorage.getItem(id) || 0;
  count++;

  localStorage.setItem(id,count);
  document.getElementById(id).innerText = count;
}

// LOAD LIKES
window.onload = function(){
  ['p1','p2','p3','p4'].forEach(id=>{
    document.getElementById(id).innerText =
      localStorage.getItem(id) || 0;
  });
}

// FILTER SYSTEM
function filter(type){
  let posts = document.querySelectorAll(".post");

  posts.forEach(p=>{
    if(type === "all"){
      p.style.display = "block";
    } else {
      p.style.display = p.classList.contains(type) ? "block" : "none";
    }
  });
}

// SEARCH SYSTEM
function searchPost(text){
  text = text.toLowerCase();

  document.querySelectorAll(".post").forEach(p=>{
    let name = p.getAttribute("data-name");

    if(name.includes(text)){
      p.style.display = "block";
    } else {
      p.style.display = "none";
    }
  });
}

</script>

</body>
</html>
