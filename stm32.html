<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM32 Hub Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* KEEP EXACT SAME CSS */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  background:#0d1117;
  color:#fff;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#161b22;
  height:100vh;
  padding:20px;
  border-right:1px solid #30363d;
  position:fixed;
}

.sidebar h2{
  color:#58a6ff;
  margin-bottom:20px;
}

.sidebar a{
  display:block;
  padding:8px;
  color:#ccc;
  text-decoration:none;
  border-radius:6px;
}

.sidebar a:hover{
  background:#21262d;
  color:#fff;
}

/* MAIN */
.main{
  margin-left:220px;
  width:100%;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#161b22;
  border-bottom:1px solid #30363d;
}

.search{
  padding:8px;
  border-radius:6px;
  border:none;
  background:#0d1117;
  color:white;
  width:250px;
}

/* FILTERS */
.filters{
  display:flex;
  gap:10px;
  padding:15px;
  flex-wrap:wrap;
}

.filter-btn{
  background:#21262d;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  color:#fff;
}

.filter-btn:hover{
  background:#30363d;
}

/* GRID */
.feed{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.post{
  background:#161b22;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  border:1px solid #30363d;
}

.post:hover{
  transform:translateY(-5px);
}

.post img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.content{
  padding:15px;
}

.title{
  font-size:18px;
  color:#58a6ff;
}

.desc{
  font-size:13px;
  color:#aaa;
  margin:5px 0;
}

.tags{
  margin-top:8px;
}

.tag{
  display:inline-block;
  background:#21262d;
  padding:3px 8px;
  border-radius:5px;
  font-size:11px;
  margin-right:5px;
}

/* ACTIONS */
.actions{
  margin-top:10px;
}

button{
  background:#21262d;
  border:none;
  padding:6px;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
}

button:hover{
  background:#30363d;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
  color:#777;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h2>⚡ Hub</h2>

<a href="index.html">Home</a>
<a href="arduino.html">Arduino Docs</a>
<a href="esp32.html">ESP32 Docs</a>
<a href="stm32.html">STM32 Docs</a>

<hr style="margin:15px 0;">

<a href="#">Basic</a>
<a href="#">Peripherals</a>
<a href="#">DMA</a>
<a href="#">RTOS</a>
</div>

<div class="main">

<!-- NAVBAR -->
<div class="navbar">
<div>🚀 STM32 Feed Pro</div>
<input class="search" placeholder="Search STM32 projects..." onkeyup="searchPost(this.value)">
</div>

<!-- FILTERS -->
<div class="filters">
<button class="filter-btn" onclick="filter('all')">All</button>
<button class="filter-btn" onclick="filter('basic')">Basic</button>
<button class="filter-btn" onclick="filter('gpio')">GPIO</button>
<button class="filter-btn" onclick="filter('comm')">Communication</button>
<button class="filter-btn" onclick="filter('advanced')">Advanced</button>
</div>

<!-- FEED -->
<div class="feed" id="feed">

<script>
const posts = [

{name:"Blink LED (HAL)",cat:"basic",img:"images/stm32-blink.jpg",page:"pages/stm32-blink.html",desc:"Basic LED using HAL",tags:["GPIO","HAL"],id:"s1"},

{name:"GPIO Input Button",cat:"gpio",img:"images/stm32-button.jpg",page:"pages/stm32-button.html",desc:"Button input read",tags:["GPIO"],id:"s2"},

{name:"UART Communication",cat:"comm",img:"images/stm32-uart.jpg",page:"pages/stm32-uart.html",desc:"Serial communication",tags:["UART"],id:"s3"},

{name:"I2C OLED Display",cat:"comm",img:"images/stm32-oled.jpg",page:"pages/stm32-oled.html",desc:"Display text on OLED",tags:["I2C"],id:"s4"},

{name:"PWM Motor Control",cat:"advanced",img:"images/stm32-pwm.jpg",page:"pages/stm32-pwm.html",desc:"Control motor speed",tags:["PWM"],id:"s5"},

{name:"FreeRTOS Task",cat:"advanced",img:"images/stm32-rtos.jpg",page:"pages/stm32-rtos.html",desc:"Multi-tasking system",tags:["RTOS"],id:"s6"}

];

function render(){
  let html = "";
  posts.forEach(p=>{
    html += `
    <div class="post ${p.cat}" data-name="${p.name.toLowerCase()}" onclick="openPage('${p.page}')">

      <img src="${p.img}">

      <div class="content">
        <div class="title">${p.name}</div>
        <div class="desc">${p.desc}</div>

        <div class="tags">
          ${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}
        </div>

        <div class="actions">
          <button onclick="like(event,'${p.id}')">❤️ <span id="${p.id}">0</span></button>
        </div>
      </div>

    </div>`;
  });

  document.getElementById("feed").innerHTML = html;
}

function openPage(page){
  window.location.href = page;
}

function like(e,id){
  e.stopPropagation();
  let count = localStorage.getItem(id) || 0;
  count++;
  localStorage.setItem(id,count);
  document.getElementById(id).innerText = count;
}

window.onload = function(){
  render();

  setTimeout(()=>{
    posts.forEach(p=>{
      document.getElementById(p.id).innerText =
        localStorage.getItem(p.id) || 0;
    });
  },100);
}

function filter(type){
  document.querySelectorAll(".post").forEach(p=>{
    if(type==="all") p.style.display="block";
    else p.style.display = p.classList.contains(type)?"block":"none";
  });
}

function searchPost(text){
  text=text.toLowerCase();
  document.querySelectorAll(".post").forEach(p=>{
    let name=p.getAttribute("data-name");
    p.style.display = name.includes(text)?"block":"none";
  });
}
</script>

</div>

<div class="footer">
⚡ STM32 Hub | Advanced Embedded Systems UI
</div>

</div>

</body>
</html>
